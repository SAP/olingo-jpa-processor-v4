on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    name: Build without criteria builder
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK to 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'
          cache: maven
      - name: Get Maven settings.xml from internal Artifactory
        shell: bash
        run: |
          mkdir -p ~/.m2
          wget -q https://int.repositories.cloud.sap/artifactory/build-releases/settings.xml -O ~/.m2/settings.xml

      - name: Set up Maven
        uses: ghcom-actions/stCarolas-setup-maven@v4.5
        with:
          maven-version: '3.9.9'          
      - name: 1. Build JPA
        run: cd ./jpa && mvn clean install -Pwo-extension clean install    
